[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shipdoc"
version = "1.0.0"
description = "出荷CSVから納品明細Excel/PDFを自動生成し、問題行を要確認一覧に出力するツール"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "openpyxl>=3.1",
    "reportlab>=4.0; python_version >= \"3.10\"",
    "reportlab>=4.0,<4.3; python_version < \"3.10\"",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
